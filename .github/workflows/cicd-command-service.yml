name: CI/CD PIPELINE - Command Service

on:
  push:
    branches:
      - cicd
      - main
    paths:
      - 'command-service/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (For ARM64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get Git Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./command-service
          platforms: linux/arm64  # Forces ARM64 build for Oracle Cloud
          push: true
          tags: |
            khalilaitnouisse/command-service:latest
            khalilaitnouisse/command-service:${{ steps.vars.outputs.sha_short }}

      - name: Deploy to OCI Master Node
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_MASTER_IP }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            echo "Updating command-service to image tag: ${{ steps.vars.outputs.sha_short }}"

            # Update the deployment with the new image and enforce replica count
            kubectl set image deployment/command-service command-service=khalilaitnouisse/command-service:${{ steps.vars.outputs.sha_short }} -n atlastickets
            kubectl scale deployment/command-service --replicas=3 -n atlastickets

            # Wait for the rollout to finish successfully
            kubectl rollout status deployment/command-service -n atlastickets
