apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: atlastickets
spec:
  serviceName: rabbitmq-service
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.12-management-alpine
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        env:
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: atlastickets-secrets
              key: RABBITMQ_URL
        - name: RABBITMQ_QUEUE_TICKET
          valueFrom:
            configMapKeyRef:
              name: atlastickets-config
              key: RABBITMQ_QUEUE_TICKET
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: atlastickets
spec:
  selector:
    app: rabbitmq
  ports:
  - port: 5672
    targetPort: 5672
    name: amqp
  - port: 15672
    targetPort: 15672
    name: management