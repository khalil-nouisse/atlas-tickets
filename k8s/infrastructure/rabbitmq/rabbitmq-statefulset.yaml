apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: atlastickets
spec:
  serviceName: rabbitmq-service
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        # 1. Switched from alpine to the stable Debian image for ARM64 compatibility
        image: rabbitmq:3.12-management
        
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        - containerPort: 15692
          name: metrics
          
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            # 2. Bumped memory to 1Gi to give the Erlang VM room to boot
            memory: "1Gi" 
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: atlastickets
  labels:                  
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
  - port: 5672
    targetPort: 5672
    name: amqp
  - port: 15672
    targetPort: 15672
    name: management
  - port: 15692
    targetPort: 15692
    name: metrics