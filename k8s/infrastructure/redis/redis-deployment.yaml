# redis-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: atlastickets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        workload-type: data
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server"]
        args:
          - "--appendonly yes"              # Enable AOF persistence
          - "--appendfsync everysec"        # Sync to disk every second
          - "--maxmemory 512mb"             # Memory limit (increased for stress test)
          - "--maxmemory-policy allkeys-lru" # Evict least recently used if full
          - "--save 60 1000"                # Also save snapshot every 60s if 1000 keys changed
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: atlastickets-secrets
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-data
          mountPath: /data  # Redis persistence directory
        resources:
          requests:
            memory: "256Mi"   # Increased from 128Mi
            cpu: "200m"       # Increased from 100m
          limits:
            memory: "768Mi"   # Increased from 256Mi (for stress test)
            cpu: "500m"       # Increased from 200m
      volumes:
      - name: redis-data
        emptyDir: {}  # For kind (temporary storage, cleared on pod restart)
        # In production, use PersistentVolumeClaim instead
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: atlastickets
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379