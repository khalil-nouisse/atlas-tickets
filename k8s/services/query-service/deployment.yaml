# k8s/services/query-service/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: atlastickets
spec:
  replicas: 3  # Run 3 instances
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
      annotations:  
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"  
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: query-service
        image: khalilaitnouisse/query-service:v9
        imagePullPolicy: Always  # using Docker Hub
        
        ports:
        - containerPort: 4000  # HTTP API for reads
          name: http
        env:
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: atlastickets-secrets
              key: POSTGRES_URL
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: atlastickets-secrets
              key: MONGO_URI
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: atlastickets-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: atlastickets-config
              key: REDIS_PORT
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: atlastickets-secrets
              key: RABBITMQ_URL
        - name: WORKER_POOL_SIZE
          valueFrom:
            configMapKeyRef:
              name: atlastickets-config
              key: WORKER_POOL_SIZE
        - name: PORT
          value: "4000"
        - name: RABBITMQ_TICKET_QUEUE
          value: "ticket_queue"
        - name: DB_NAME
          value: "tickets_read_db"
        - name: COLLECTION_NAME
          value: "bookings"
        resources:
          requests:
            memory: "100Mi"
            cpu: "128m"
          limits:
            memory: "256Mi"
            cpu: "300m"
---
# Service to expose query-service
apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: atlastickets
  labels:
    app: query-service
spec:
  selector:
    app: query-service
  ports:
  - port: 4000
    targetPort: 4000
    name: http
  - port: 4000
    targetPort: 4000
    name: metrics
  
  type: ClusterIP  # Internal only (accessed via Ingress)

  