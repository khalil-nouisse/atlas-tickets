# k8s/services/query-service/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: atlastickets
spec:
  replicas: 3  # Run 3 instances
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
    spec:
      containers:
      - name: query-service
        image: atlastickets/query-service:latest
        imagePullPolicy: IfNotPresent 
        
        ports:
        - containerPort: 4000  # HTTP API for reads
          name: http
        env:
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: atlastickets-secrets
              key: POSTGRES_URL
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: atlastickets-secrets
              key: MONGO_URI
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: atlastickets-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: atlastickets-config
              key: REDIS_PORT
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: atlastickets-secrets
              key: RABBITMQ_URL
        - name: WORKER_POOL_SIZE
          valueFrom:
            configMapKeyRef:
              name: atlastickets-config
              key: WORKER_POOL_SIZE
        - name: PORT
          value: "4000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
# Service to expose query-service
apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: atlastickets
  labels:
    app: query-service
spec:
  selector:
    app: query-service
  ports:
  - port: 4000
    targetPort: 4000
    name: http
  type: ClusterIP  # Internal only (accessed via Ingress)

  