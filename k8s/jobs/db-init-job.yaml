apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-scripts
  namespace: atlastickets
data:
  01-schema.sql: |
    -- Drop existing tables to ensure clean slate
    DROP TABLE IF EXISTS bookings CASCADE;
    DROP TABLE IF EXISTS ticket_inventory CASCADE;
    DROP TABLE IF EXISTS matches CASCADE;
    DROP TABLE IF EXISTS users CASCADE;
    
    -- A. Users Table
    CREATE TABLE IF NOT EXISTS users (
        user_id SERIAL PRIMARY KEY,
        email VARCHAR(255) UNIQUE NOT NULL,
        full_name VARCHAR(100),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- B. Matches Table (AFCON Context)
    CREATE TABLE IF NOT EXISTS matches (
        match_id SERIAL PRIMARY KEY,
        home_team VARCHAR(50) NOT NULL,
        away_team VARCHAR(50) NOT NULL,
        match_date TIMESTAMP NOT NULL,
        stadium VARCHAR(100) NOT NULL,
        is_active BOOLEAN DEFAULT TRUE
    );

    -- C. Inventory Table (Category Based)
    CREATE TABLE IF NOT EXISTS ticket_inventory (
        inventory_id SERIAL PRIMARY KEY,
        match_id INT REFERENCES matches(match_id),
        category VARCHAR(20) NOT NULL,
        price DECIMAL(10, 2) NOT NULL,
        total_seats INT NOT NULL,
        sold_seats INT DEFAULT 0,
        
        UNIQUE(match_id, category),
        CONSTRAINT check_capacity CHECK (sold_seats <= total_seats)
    );

    -- D. Bookings Table (The Transaction Log)
    CREATE TABLE IF NOT EXISTS bookings (
        booking_id VARCHAR(255) PRIMARY KEY,
        user_id INT REFERENCES users(user_id),
        match_id INT REFERENCES matches(match_id),
        category VARCHAR(20) NOT NULL,
        quantity INT NOT NULL,
        status VARCHAR(20) DEFAULT 'PENDING',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

  02-seed-data.sql: |
    -- 1. Generate 100k test users directly
    -- We use a subquery to avoid any conflict with existing emails
    INSERT INTO users (email, full_name)
    SELECT 
        'loadtest-' || gs || '@test.com',
        'Load Test User ' || gs
    FROM generate_series(1, 100000) AS gs
    ON CONFLICT (email) DO NOTHING;

    -- 2. Matches
    INSERT INTO matches (match_id, home_team, away_team, match_date, stadium) 
    VALUES 
        (1, 'Morocco', 'South Africa', '2026-01-30 20:00:00', 'Stade Adrar - Agadir'),
        (2, 'Algeria', 'Egypt', '2026-02-15 21:00:00', 'Stade Mustapha Tchaker - Blida'),
        (3, 'Nigeria', 'Cameroon', '2026-02-20 21:00:00', 'Godswill Akpabio Stadium - Uyo')
    ON CONFLICT (match_id) DO NOTHING;

    -- 3. Inventory
    INSERT INTO ticket_inventory (match_id, category, price, total_seats, sold_seats) 
    VALUES 
        (1, 'VIP', 2000.00, 50, 0),
        (1, 'CAT1', 500.00, 100, 0),
        (2, 'VIP', 3000.00, 20, 0),
        (2, 'CAT1', 800.00, 150, 0),
        (3, 'VIP', 3000.00, 5000, 0),
        (3, 'CAT1', 800.00, 10000, 0)
    ON CONFLICT (match_id, category) DO NOTHING;

  03-indexes.sql: |
    -- Indexes for performance
    CREATE INDEX IF NOT EXISTS idx_inventory_match ON ticket_inventory(match_id);
    CREATE INDEX IF NOT EXISTS idx_bookings_user ON bookings(user_id);
    CREATE INDEX IF NOT EXISTS idx_bookings_match ON bookings(match_id);
    CREATE INDEX IF NOT EXISTS idx_bookings_status ON bookings(status);

---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-job
  namespace: atlastickets
spec:
  template:
    spec:
      containers:
      - name: db-initializer
        image: postgres:15-alpine
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Waiting for Postgres Service..."
            until pg_isready -h postgres-service -U $POSTGRES_USER; do
              echo "Waiting for database..."
              sleep 2
            done

            echo "Running Schema Script..."
            psql -h postgres-service -U $POSTGRES_USER -d $POSTGRES_DB -f /scripts/01-schema.sql
            
            echo "Running Seed Data Script (this will take ~10 seconds for 100K users)..."
            psql -h postgres-service -U $POSTGRES_USER -d $POSTGRES_DB -f /scripts/02-seed-data.sql
            
            echo "Running Indexes Script..."
            psql -h postgres-service -U $POSTGRES_USER -d $POSTGRES_DB -f /scripts/03-indexes.sql
            
            echo ""
            echo "Database Initialization Complete!"
            echo "User count:"
            psql -h postgres-service -U $POSTGRES_USER -d $POSTGRES_DB -c "SELECT COUNT(*) as total_users FROM users;"
            echo ""
            echo "Inventory:"
            psql -h postgres-service -U $POSTGRES_USER -d $POSTGRES_DB -c "SELECT match_id, category, total_seats FROM ticket_inventory;"
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: atlastickets-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: atlastickets-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: atlastickets-secrets
              key: POSTGRES_PASSWORD
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: atlastickets-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: scripts-volume
          mountPath: /scripts
      restartPolicy: Never
      volumes:
      - name: scripts-volume
        configMap:
          name: db-init-scripts
  backoffLimit: 4